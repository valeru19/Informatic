name: Python CI  # Имя workflow, отображается на GitHub в разделе Actions

on:
  push:
    branches:
      - main  # Срабатывает при пуше в ветку main
  pull_request:
    branches:
      - main  # Срабатывает при создании pull request в ветку main

jobs:
  test:  # Имя задачи (job)
    runs-on: ubuntu-latest  # Используемая виртуальная машина (операционная система)

    steps:
    - name: Checkout repository  # Шаг клонирования репозитория
      uses: actions/checkout@v3  # Использование готового действия для клонирования кода

    - name: Set up Python 3.8  # Установка Python версии 3.8
      uses: actions/setup-python@v4  # Использование готового действия для установки Python
      with:
        python-version: '3.8'  # Указание версии Python

    - name: Install dependencies  # Установка необходимых библиотек
      run: |
        python -m pip install --upgrade pip  # Обновление pip до последней версии
        pip install -r requirements.txt  # Установка зависимостей из requirements.txt

    - name: Set PYTHONPATH  # Настройка переменной окружения PYTHONPATH
      run: |
        echo "PYTHONPATH=$PYTHONPATH:$(pwd)" >> $GITHUB_ENV  # Добавление текущей директории в PYTHONPATH

    - name: Run tests and generate report  # Запуск тестов и генерация HTML-отчета
      run: |
        pytest --html=report.html --self-contained-html  # Генерация HTML-отчета о тестах

    - name: Upload test report  # Загрузка HTML-отчета как артефакта
      uses: actions/upload-artifact@v3  # Использование готового действия для загрузки артефактов
      with:
        name: test-report  # Имя артефакта, под которым будет сохранен файл
        path: report.html  # Путь к файлу отчета, который нужно загрузить
